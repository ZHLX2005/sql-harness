<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sql-harness docs</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-name">sql-harness</span>
      <span class="brand-ver" id="version"></span>
    </div>

    <div class="search-wrap">
      <input id="filter" class="filter" type="search" placeholder="搜索文档…  (Enter 搜正文)" autocomplete="off">
      <button id="btn-deep" class="deep" type="button" title="同时搜索文件内容">正文</button>
    </div>
    <div id="results" class="results" hidden></div>

    <nav id="nav" class="nav"></nav>

    <div class="sidebar-foot">
      <span class="dot" id="ro-dot"></span><span id="ro-label">可编辑</span>
      <span class="foot-spacer"></span>
      <button id="btn-theme" class="icon" type="button" title="切换主题 (Ctrl+Shift+L)">◐</button>
      <button id="btn-help" class="icon" type="button" title="快捷键 (?)">?</button>
    </div>
  </aside>

  <main class="content">
    <header class="doc-head">
      <div class="crumb" id="crumb">选择左侧的文档</div>
      <div class="actions">
        <button id="btn-new" type="button" title="新建文档 (Ctrl+N)">新建</button>
        <button id="btn-rename" type="button" hidden title="重命名 (F2)">重命名</button>
        <button id="btn-delete" type="button" hidden title="删除">删除</button>
        <button id="btn-refresh" type="button" title="重新读取文件树">刷新</button>
        <button id="btn-edit" type="button" hidden title="编辑 (Ctrl+E)">编辑</button>
        <button id="btn-save" type="button" class="primary" hidden title="保存 (Ctrl+S)">保存</button>
        <button id="btn-cancel" type="button" hidden title="取消 (Esc)">取消</button>
      </div>
    </header>

    <!-- connections.toml: structured view, one tab per connection. -->
    <div id="conn" class="conn" hidden></div>

    <div id="meta" class="meta" hidden></div>
    <article id="doc" class="markdown"></article>
    <textarea id="editor" class="editor" hidden spellcheck="false"></textarea>
    <div id="status" class="status" hidden></div>
  </main>
</div>

<!-- right-click menu for the tree -->
<div id="menu" class="menu" hidden></div>

<!-- shortcuts / about -->
<div id="help" class="modal" hidden>
  <div class="modal-box">
    <h2>快捷键</h2>
    <table class="keys">
      <tr><td><kbd>Ctrl</kbd>+<kbd>S</kbd></td><td>保存</td></tr>
      <tr><td><kbd>Ctrl</kbd>+<kbd>E</kbd></td><td>编辑 / 退出编辑</td></tr>
      <tr><td><kbd>Ctrl</kbd>+<kbd>N</kbd></td><td>新建文档</td></tr>
      <tr><td><kbd>F2</kbd></td><td>重命名当前文档</td></tr>
      <tr><td><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>L</kbd></td><td>切换明暗主题</td></tr>
      <tr><td><kbd>Esc</kbd></td><td>取消编辑 / 关闭弹层</td></tr>
    </table>
    <p class="hint">在左侧文件上右键，可以新建 / 重命名 / 删除。<code>connections.toml</code> 会以结构化面板展示，同时保留原文编辑。</p>
    <button id="btn-help-close" class="primary" type="button">知道了</button>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
