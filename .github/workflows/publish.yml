# sql-harness PyPI release pipeline.
#
# Trigger: push a tag matching v* (annotated or lightweight — both are pushed
# explicitly, see the push step below). Also runnable manually from the
# Actions tab.
#
# Flow: tag → setup Node + Python → build the SPA (npm ci && npm run build,
#        regenerating src/sql_harness/_web_assets/) → test → wheel build →
#        local smoke test → publish to PyPI → verify the exact version is live
#        on pypi.org.
#
# The release itself is NOT auto-bumped here (unlike the old monorepo
# `v-sqlharness:` commit-prefix flow): the maintainer bumps `version` in
# pyproject.toml, commits, then `git tag vX.Y.Z && git push origin vX.Y.Z`.
# Explicit is safer than auto-bump for a standalone repo.
name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install uv
        run: pip install uv

      - name: Build the SPA (Vite output → src/sql_harness/_web_assets/)
        run: |
          cd web
          npm ci
          npm run build
        # vite.config.ts writes the production bundle directly into the
        # Python package's _web_assets/ dir; `emptyOutDir: true` wipes any
        # stale local artifacts before writing fresh ones. This step MUST
        # run before `uv build` so the force-include paths exist on disk.

      - name: Guard — version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -e
          TAG="${GITHUB_REF#refs/tags/}"
          VER=$(grep -E '^version = ' pyproject.toml | sed -E 's/^version = "([^"]+)"/\1/')
          echo "tag:   $TAG"
          echo "pyproject version: $VER"
          if [ "v$VER" != "$TAG" ]; then
            echo "::error::tag $TAG does not match pyproject version $VER. Bump version, commit, re-tag."
            exit 1
          fi

      - name: Run unit tests
        run: uv run pytest tests/unit -v

      - name: Build wheel and sdist
        run: rm -rf dist && uv build

      - name: Verify wheel bundles the SPA
        run: |
          set -e
          VER=$(grep -E '^version = ' pyproject.toml | sed -E 's/^version = "([^"]+)"/\1/')
          python - <<EOF
          import zipfile
          with zipfile.ZipFile('dist/sql_harness-$VER-py3-none-any.whl') as z:
              names = z.namelist()
              assert any(n == 'sql_harness/_web_assets/index.html' for n in names), 'index.html missing'
              assert any(n.startswith('sql_harness/_web_assets/index-') and n.endswith('.js') for n in names), 'hashed JS missing'
              assert any(n.startswith('sql_harness/_web_assets/index-') and n.endswith('.css') for n in names), 'hashed CSS missing'
              print('wheel bundle OK:', len(names), 'entries, SPA present')
          EOF

      - name: Smoke test the wheel (install as a user would)
        run: |
          set -e
          VER=$(grep -E '^version = ' pyproject.toml | sed -E 's/^version = "([^"]+)"/\1/')
          uv tool install "dist/sql_harness-$VER-py3-none-any.whl"
          sql-harness version
          # Heredoc mode — the primary agent-facing entry point. Verify the
          # helpers are pre-imported into the exec namespace (no DB needed:
          # CI has no connections.toml, so anything touching a workspace
          # would fail by design).
          echo 'assert callable(query) and callable(use_workspace); print("heredoc helpers ok")' | sql-harness
          # Boot the web server briefly and confirm the React SPA loads end
          # to end (HTML + hashed JS/CSS). Loopback-only is fine on the
          # Actions runner.
          sql-harness web --port 18765 --no-open &
          SQL_H_PID=$!
          sleep 2
          curl -fsS http://127.0.0.1:18765/ -o /tmp/sqlh_index.html
          curl -fsS http://127.0.0.1:18765/api/health
          grep -q '<div id="root">' /tmp/sqlh_index.html
          # Vite base is /static/, hashed chunks sit at _web_assets/ root:
          # the shell references /static/index-<hash>.js|css (+ lazy chunks).
          grep -Eq '/static/[A-Za-z0-9_-]+\.(js|css)' /tmp/sqlh_index.html
          # And the hashed chunk itself must be fetchable (immutable cache).
          CHUNK=$(grep -Eo '/static/[A-Za-z0-9_-]+\.js' /tmp/sqlh_index.html | head -1)
          curl -fsSI "http://127.0.0.1:18765$CHUNK" | grep -qi "200 OK"
          curl -fsSI "http://127.0.0.1:18765$CHUNK" | grep -qi "immutable"
          echo "web SPA + API smoke OK"
          kill $SQL_H_PID 2>/dev/null || true
          uv tool uninstall sql-harness

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          set -e
          if [ -z "$UV_PUBLISH_TOKEN" ]; then
            echo '::error::PYPI_TOKEN secret is empty. Set with: gh secret set PYPI_TOKEN -R ZHLX2005/sql-harness <value>'
            exit 1
          fi
          uv publish
          unset UV_PUBLISH_TOKEN

      - name: Verify on PyPI
        run: |
          set -e
          sleep 10
          VER=$(grep -E '^version = ' pyproject.toml | sed -E 's/^version = "([^"]+)"/\1/')
          echo "expected version on PyPI: $VER"
          # Primary check: version-specific endpoint. It goes live the moment
          # the upload is processed, unlike /pypi/<name>/json whose top-level
          # info.version follows the project page update and can lag by
          # minutes — a successful publish used to fail this step on that lag
          # alone (carried over from the monorepo release.yml fix).
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/sql-harness/$VER/json")
          echo "version endpoint HTTP status: $CODE"
          if [ "$CODE" != "200" ]; then
            for i in 1 2 3 4 5; do
              sleep 20
              CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/sql-harness/$VER/json")
              echo "retry $i: HTTP $CODE"
              [ "$CODE" = "200" ] && break
            done
          fi
          [ "$CODE" = "200" ] || { echo "::error::sql-harness $VER not visible on PyPI after retries (last HTTP $CODE)"; exit 1; }
          echo "sql-harness $VER is live on PyPI: https://pypi.org/project/sql-harness/$VER/"

  # Manual test job — runnable via `gh workflow run publish` (workflow_dispatch).
  # Kept minimal: npm build (so SPA exists) + the test suite as a fast
  # feedback loop. The full publish job also runs unit tests as part of
  # its flow.
  test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install uv
      - name: Build the SPA
        run: cd web && npm ci && npm run build
      - name: Run unit tests
        run: uv run pytest tests/unit -v